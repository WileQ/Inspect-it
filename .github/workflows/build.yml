name: Build & test

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Never auto-discover signing identities. Signing happens ONLY when the
      # CSC_LINK secret is actually provided (see the guarded export below), so
      # unsigned builds always succeed.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (pinned to the supported version)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package.json is the single source of truth for the version. If the tag
      # and package.json disagree (e.g. tag v1.0.1 vs version 1.0.0), fail now
      # so a release can never carry mismatched artifact/application versions.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test
        env:
          # OCR diagnostics surface the exact engine state if Milestone 06
          # fails in CI (image format, normalization, lang/core paths, outcome).
          INSPECT_IT_OCR_DEBUG: '1'

      # Build commands bake in `--publish never` (see package.json scripts), so
      # electron-builder never implicitly publishes to GitHub from a tag. Each
      # installer is uploaded as a workflow artifact; the dedicated `release`
      # job is the ONLY publisher.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "$CSC_LINK_VALUE" ]; then export CSC_LINK="$CSC_LINK_VALUE"; fi
          if [ -n "$CSC_KEY_PASSWORD_VALUE" ]; then export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_VALUE"; fi
          npm run dist:win
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build macOS app (unsigned unless cert provided; notarized on release tags when Apple credentials exist)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Only export signing env when the certificate secret is actually set.
          # electron-builder treats a present-but-empty CSC_LINK as "signing
          # configured" and fails with "not a file"; leaving it unset produces
          # a clean ad-hoc (unsigned) build when no certificate is configured.
          if [ -n "$CSC_LINK_VALUE" ]; then export CSC_LINK="$CSC_LINK_VALUE"; fi
          if [ -n "$CSC_KEY_PASSWORD_VALUE" ]; then export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_VALUE"; fi
          if [ -n "$APPLE_ID_VALUE" ]; then export APPLE_ID="$APPLE_ID_VALUE"; fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_VALUE" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_VALUE"; fi
          if [ -n "$APPLE_TEAM_ID_VALUE" ]; then export APPLE_TEAM_ID="$APPLE_TEAM_ID_VALUE"; fi
          if [ "$NOTARIZE" = "true" ]; then
            npm run dist:mac -- -c.mac.notarize=true
          else
            npm run dist:mac
          fi
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID != '' }}

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    # GitHub Actions auto-skips a `needs:` job when a dependency is skipped or
    # fails, UNLESS the job uses `always()`. We want the release job to RUN on
    # every v-tag push so it can clearly report why it cannot publish, instead
    # of being silently "skipped". The job then requires `needs.build` to have
    # succeeded before it publishes (see the guard step below). Branch/PR runs
    # never reach this job (ref_type is 'branch' or the event is pull_request).
    if: always() && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Each job gets a fresh workspace, so check out the tag before running
      # repo scripts (e.g. scripts/check-release-version.mjs) or reading
      # package.json. On a tag push this checks out the tagged commit.
      - name: Checkout
        uses: actions/checkout@v4

      # Clear, actionable failure instead of a silent skip: this step fails the
      # job (and explains why) whenever any platform build leg did not succeed.
      - name: Require successful platform builds
        if: needs.build.result != 'success'
        run: |
          echo "::error::Release not published: the platform build job finished with result '${{ needs.build.result }}'. Inspect the build job logs (e.g. npm test / installer build) and re-run after fixing."
          exit 1

      - name: Set up Node (pinned to the supported version)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true

      # Never publish a release with missing installers: list what we got and
      # fail loudly if any expected platform artifact is absent.
      - name: Verify installers present
        run: |
          echo "Downloaded artifacts:"
          (find artifacts -type f 2>/dev/null | sort) || ls -R artifacts
          missing=0
          for pattern in '*.exe' '*.dmg' '*.zip' '*.AppImage' '*.deb'; do
            found=$(find artifacts -type f -name "$pattern" 2>/dev/null | wc -l | tr -d ' ')
            echo "$pattern -> $found file(s)"
            if [ "$found" -eq 0 ]; then missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Expected platform installers are missing; refusing to create a source-only release."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: Inspect It ${{ github.ref_name }}
          body: |
            ## Inspect It ${{ github.ref_name }}

            Installers for all platforms, attached to this release (version = `${{ github.ref_name }}` without the leading `v`, matching package.json):

            - **Windows x64**: NSIS installer (`.exe`)
            - **macOS x64 + arm64**: `.dmg` and `.zip`
            - **Linux x64**: `.AppImage` and `.deb`

            The version/tag flow and macOS signing/notarization notes live in
            [docs/RELEASING.md](../../docs/RELEASING.md).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
